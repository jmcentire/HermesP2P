name: Sandbox and transport tests
on:
  push:
    branches: ['main', 'review/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm test
      - run: python -m pip install flask flask-sock pytest
      - run: python -m pytest tests/test_relay.py
      - run: python tests/browser/check_context_server.py
      - run: python tests/browser/check_ui_server.py
      - run: python tests/browser/check_candidate_server.py
      - run: python tests/browser/check_four_peer_server.py
      - run: node tests/browser/check_signature_control.mjs
      - run: node tests/check_sealed_mutations.mjs
